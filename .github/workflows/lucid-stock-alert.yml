name: Lucid stock Telegram alert

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      stock_symbol:
        description: "Stock symbol to check"
        required: false
        default: ""
      lower_price_threshold:
        description: "Alert when the stock price is below this value"
        required: false
        default: ""
      upper_price_threshold:
        description: "Alert when the stock price is above this value"
        required: false
        default: ""
      dry_run:
        description: "Check price without sending Telegram messages"
        required: false
        default: "false"
      monitoring_cycles:
        description: "Manual-run polling cycles. Scheduled runs always use 10 cycles."
        required: false
        default: "1"
      continue_monitoring:
        description: "Dispatch the next monitoring run when this one finishes."
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: lucid-stock-alert
  cancel-in-progress: false

jobs:
  check-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CONTINUE_MONITORING: ${{ github.event_name == 'schedule' && 'true' || inputs.continue_monitoring || 'false' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check stock prices and send Telegram alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CONFIG_PATH: config/stock_alert.json
          STOCK_SYMBOL: ${{ inputs.stock_symbol || '' }}
          LOWER_PRICE_THRESHOLD: ${{ inputs.lower_price_threshold || '' }}
          UPPER_PRICE_THRESHOLD: ${{ inputs.upper_price_threshold || '' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          MONITORING_CYCLES: ${{ github.event_name == 'schedule' && '10' || inputs.monitoring_cycles || '1' }}
          MONITORING_INTERVAL_SECONDS: "30"
        run: |
          for cycle in $(seq 1 "$MONITORING_CYCLES"); do
            echo "Monitoring cycle ${cycle}/${MONITORING_CYCLES}"
            python3 scripts/stock_alert.py
            if [ "$cycle" -lt "$MONITORING_CYCLES" ]; then
              sleep "$MONITORING_INTERVAL_SECONDS"
            fi
          done

      - name: Persist Telegram command settings
        run: |
          if ! git diff --quiet -- config/stock_alert.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add config/stock_alert.json
            git commit -m "Update stock alert settings"
            git push
          fi

      - name: Dispatch next monitoring run
        if: ${{ always() && env.CONTINUE_MONITORING == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GH_WORKFLOW_PAT }}
        run: |
          gh workflow run lucid-stock-alert.yml \
            --ref main \
            -f stock_symbol='' \
            -f lower_price_threshold='' \
            -f upper_price_threshold='' \
            -f dry_run=false \
            -f monitoring_cycles=10 \
            -f continue_monitoring=true
